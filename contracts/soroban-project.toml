[project]
name = "stellar-nft-marketplace-contracts"
version = "0.1.0"
description = "Stellar NFT Marketplace Smart Contracts"

[dependencies]

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
